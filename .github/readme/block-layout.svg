<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
<title id="t">Block layout</title>
<desc id="d">Each block starts with a 16-byte free_block header holding the payload size and a next pointer, followed by the payload rounded up to a multiple of 16. The caller receives a pointer just past the header.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style>
<rect width="1280" height="300" rx="24" fill="#060B10"/>
<text x="40" y="48" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;letter-spacing:3px" fill="#22D3EE">ANATOMY OF A BLOCK</text>
<rect x="40" y="80" width="260" height="90" rx="6" fill="#0E3A47" stroke="#22D3EE"/><text x="170" y="118" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:16px" fill="#E0F2FE">size_t size</text><text x="170" y="144" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px" fill="#67E8F9">payload bytes</text>
<rect x="300" y="80" width="260" height="90" rx="6" fill="#0E3A47" stroke="#22D3EE"/><text x="430" y="118" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:16px" fill="#E0F2FE">free_block *next</text><text x="430" y="144" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px" fill="#67E8F9">free-list link</text>
<rect x="560" y="80" width="680" height="90" rx="6" fill="#0891B2" stroke="#22D3EE"/><text x="900" y="118" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:16px" fill="#ECFEFF">payload · rounded up to a multiple of 16</text><text x="900" y="144" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px" fill="#CFFAFE">(size + 15) &amp; ~15</text>
<path d="M560 196 v-14 M560 196 h0" stroke="#FBBF24" stroke-width="2"/><path d="M560 200 l-8 14 h16z" fill="#FBBF24"/>
<text x="560" y="238" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px" fill="#FBBF24">pointer returned to the caller</text>
<text x="40" y="214" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px" fill="#64748B">struct free_block (16 bytes on x86-64)</text>
<text x="40" y="272" style="font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px" fill="#94A3B8">tufree(ptr) steps back one header, (free_block *)ptr - 1, and pushes the block onto the free list.</text>
</svg>
